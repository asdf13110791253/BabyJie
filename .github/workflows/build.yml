# File: .github/workflows/build.yml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    
    - name: Download OpenCV Android SDK
      run: |
        echo "=== 下载 OpenCV ==="
        wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
        echo "=== 解压 ==="
        unzip -q opencv-4.9.0-android-sdk.zip
        echo "=== 创建目录 ==="
        mkdir -p app/libs
        mkdir -p app/src/main/jniLibs
        echo "=== 复制 jar ==="
        cp OpenCV-android-sdk/sdk/java/opencv-java4.jar app/libs/
        echo "=== 复制 native 库 ==="
        cp -r OpenCV-android-sdk/sdk/native/libs/* app/src/main/jniLibs/
        echo "=== 验证 ==="
        ls -la app/libs/
        ls -la app/src/main/jniLibs/
    
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
