# File: .github/workflows/build.yml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    
    - name: Download and prepare OpenCV
      run: |
        echo "=== 下载 OpenCV Android SDK ==="
        curl -L -o opencv.zip https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
        echo "=== 检查下载文件 ==="
        ls -lh opencv.zip
        echo "=== 解压 ==="
        unzip -q opencv.zip
        echo "=== 列出解压后的根目录 ==="
        ls -la
        # 查找 opencv-java4.jar 的实际路径
        echo "=== 查找 jar 文件 ==="
        find . -name "opencv-java4.jar" -type f
        # 确保 app/libs 目录存在
        mkdir -p app/libs
        # 直接复制找到的 jar 文件（如果存在）
        JAR_PATH=$(find . -name "opencv-java4.jar" -type f | head -n 1)
        if [ -n "$JAR_PATH" ]; then
          cp "$JAR_PATH" app/libs/
          echo "=== jar 复制成功 ==="
        else
          echo "!!! 未找到 opencv-java4.jar，构建将失败 !!!"
          exit 1
        fi
        # 复制 native 库到 jniLibs
        mkdir -p app/src/main/jniLibs
        NATIVE_DIR=$(find . -path "*/native/libs" -type d | head -n 1)
        if [ -n "$NATIVE_DIR" ]; then
          cp -r "$NATIVE_DIR"/* app/src/main/jniLibs/
          echo "=== native 库复制成功 ==="
        else
          echo "!!! 未找到 native 库目录 !!!"
        fi
        echo "=== 验证 app/libs 内容 ==="
        ls -la app/libs/
        echo "=== 验证 jniLibs 内容 ==="
        ls -la app/src/main/jniLibs/
    
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
