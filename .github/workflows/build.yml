# File: .github/workflows/build.yml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    
    - name: Download OpenCV Android SDK
      run: |
        echo "下载 OpenCV Android SDK..."
        wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
        unzip -q opencv-4.9.0-android-sdk.zip
        echo "OpenCV 下载完成"
        ls -la OpenCV-android-sdk/sdk/
    
    - name: Copy OpenCV to app libs
      run: |
        mkdir -p app/libs
        cp OpenCV-android-sdk/sdk/java/opencv-java4.jar app/libs/ 2>/dev/null || echo "未找到jar文件"
        ls -la app/libs/
    
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
