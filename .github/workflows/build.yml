name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    
    - name: Download and prepare OpenCV
      run: |
        echo "=== 下载 OpenCV Android SDK ==="
        curl -L -o opencv.zip https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
        echo "=== 解压 ==="
        unzip -q opencv.zip
        
        # 清理旧 libs，确保没有残留
        rm -rf app/libs
        mkdir -p app/libs
        mkdir -p app/src/main/jniLibs
        
        # 查找 JAR
        JAR_PATH=""
        if [ -f "OpenCV-android-sdk/sdk/java/opencv-java4.jar" ]; then
          JAR_PATH="OpenCV-android-sdk/sdk/java/opencv-java4.jar"
        elif [ -f "OpenCV-android-sdk/sdk/java/opencv-490.jar" ]; then
          JAR_PATH="OpenCV-android-sdk/sdk/java/opencv-490.jar"
        else
          JAR_PATH=$(find OpenCV-android-sdk -name "*.jar" -type f | head -n 1)
        fi
        
        if [ -n "$JAR_PATH" ] && [ -f "$JAR_PATH" ]; then
          cp "$JAR_PATH" app/libs/opencv-java4.jar
          echo "✅ JAR 复制成功"
          # 验证 JAR 包含 OpenCV 类
          echo "=== JAR 内容预览（org/opencv 相关） ==="
          jar tf app/libs/opencv-java4.jar | grep "org/opencv" | head -10 || echo "⚠️ 未找到 org/opencv 类，JAR 可能不完整"
          echo "=== JAR 文件大小 ==="
          ls -lh app/libs/opencv-java4.jar
        else
          echo "❌ 未找到 JAR 文件"
          exit 1
        fi
        
        # 复制 Native 库
        NATIVE_DIR="OpenCV-android-sdk/sdk/native/libs"
        if [ -d "$NATIVE_DIR" ]; then
          cp -r "$NATIVE_DIR"/* app/src/main/jniLibs/
          echo "✅ Native 库复制成功"
          echo "=== Native 库列表 ==="
          ls -la app/src/main/jniLibs/
        else
          echo "⚠️ 未找到 Native 库，尝试查找..."
          NATIVE_DIR=$(find OpenCV-android-sdk -path "*/native/libs" -type d | head -n 1)
          if [ -n "$NATIVE_DIR" ]; then
            cp -r "$NATIVE_DIR"/* app/src/main/jniLibs/
            echo "✅ Native 库复制成功（通过查找）"
          else
            echo "❌ 未找到 Native 库"
          fi
        fi
        
        echo "=== 最终验证 app/libs ==="
        ls -la app/libs/
    
    - name: Build Debug APK
      run: |
        # 先检查文件是否存在
        echo "=== 构建前验证 ==="
        ls -la app/libs/ || echo "app/libs 不存在"
        # 清理并构建
        gradle clean --no-daemon --stacktrace
        gradle assembleDebug --no-daemon --stacktrace --refresh-dependencies
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
