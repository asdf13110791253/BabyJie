name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    
    - name: Download and prepare OpenCV
      run: |
        echo "=== 下载 OpenCV Android SDK ==="
        curl -L -o opencv.zip https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
        echo "=== 解压 ==="
        unzip -q opencv.zip
        
        mkdir -p app/libs
        mkdir -p app/src/main/jniLibs
        
        # 查找 JAR 并重命名为 opencv-java4.jar
        JAR_PATH=""
        if [ -f "OpenCV-android-sdk/sdk/java/opencv-java4.jar" ]; then
          JAR_PATH="OpenCV-android-sdk/sdk/java/opencv-java4.jar"
        elif [ -f "OpenCV-android-sdk/sdk/java/opencv-490.jar" ]; then
          JAR_PATH="OpenCV-android-sdk/sdk/java/opencv-490.jar"
        else
          JAR_PATH=$(find OpenCV-android-sdk -name "*.jar" -type f | head -n 1)
        fi
        
        if [ -n "$JAR_PATH" ] && [ -f "$JAR_PATH" ]; then
          cp "$JAR_PATH" app/libs/opencv-java4.jar
          echo "=== JAR 复制成功（重命名为 opencv-java4.jar） ==="
        else
          echo "!!! 未找到 JAR 文件 !!!"
          exit 1
        fi
        
        # 复制 Native 库
        NATIVE_DIR="OpenCV-android-sdk/sdk/native/libs"
        if [ -d "$NATIVE_DIR" ]; then
          cp -r "$NATIVE_DIR"/* app/src/main/jniLibs/
          echo "=== Native 库复制成功 ==="
        else
          NATIVE_DIR=$(find OpenCV-android-sdk -path "*/native/libs" -type d | head -n 1)
          if [ -n "$NATIVE_DIR" ]; then
            cp -r "$NATIVE_DIR"/* app/src/main/jniLibs/
            echo "=== Native 库复制成功（通过查找） ==="
          else
            echo "!!! 未找到 Native 库 !!!"
          fi
        fi
        
        echo "=== 验证 app/libs ==="
        ls -la app/libs/
        if [ -f "app/libs/opencv-java4.jar" ]; then
          echo "✅ opencv-java4.jar 存在"
        else
          echo "❌ opencv-java4.jar 不存在"
          exit 1
        fi
        echo "=== 验证 jniLibs ==="
        ls -la app/src/main/jniLibs/ || echo "jniLibs 不存在"
    
    - name: Build Debug APK
      run: |
        gradle clean --no-daemon
        gradle assembleDebug --no-daemon --stacktrace --refresh-dependencies
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
